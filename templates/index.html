<!DOCTYPE html>
<html>
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Speed Test</title>
 <style>
  input[type=submit] {
   border: 1px solid #ccc;
   display: inline-block;
   background-color: royalblue;
   border: none;
   color: white;
   padding: 16px 32px;
   text-decoration: none;
   margin: 4px 2px;
   cursor: pointer;
   border-radius: 10px;
   width:240px;
  }
  input[type="file"] {
   display: none;
  }
  .custom-file-upload {
   border: 1px solid #ccc;
   display: inline-block;
   background-color: royalblue;
   border: none;
   color: white;
   padding: 16px 32px;
   text-decoration: none;
   margin: 4px 2px;
   cursor: pointer;
   border-radius: 10px;
   width: 180px;
  }
 </style>
</head>
<body>
 <!-- ******************************************************************** -->
 <hr>
 <p style="font-family: 'Arial', monospace; font-size: 32px; font-weight: bold; text-decoration: underline; color: royalblue">Speed Test</p>
 <hr>
 <!-- ******************************************************************** -->
 <!-- <p style="font-family: 'Arial', monospace; font-size: 20px; font-weight: bold; color: royalblue">Measuring Download Speed</p> -->
 <button onclick="measureDownloadSpeed()" style="background-color: royalblue; border: none; color: white; padding: 16px 32px; text-decoration: none; margin: 4px 2px; cursor: pointer; border-radius: 10px; width: 240px;">Measure Download Speed</button>
 <div style="height:20px;" id="downloadResult"></div>
 <script>
  function measureDownloadSpeed() {
    const xhr = new XMLHttpRequest();
    const report = message => { document.getElementById('downloadResult').textContent = message; };
    xhr.open('GET', '/download', true);
    xhr.responseType = 'blob';
    xhr.timeout = 60000;
    const started = performance.now();
    xhr.onload = () => {
      if (xhr.status < 200 || xhr.status >= 300) {
        report('Download failed (HTTP ' + xhr.status + ').');
        return;
      }
      const seconds = (performance.now() - started) / 1000;
      const bytes = xhr.response.size;
      if (seconds <= 0 || bytes === 0) {
        report('The download duration or payload could not be measured.');
        return;
      }
      report('Download Speed: ' + (bytes * 8 / seconds / 1000000).toFixed(2) + ' Mbps');
      const sizeOutput = document.getElementById('downloadFileSize');
      if (sizeOutput) sizeOutput.textContent = 'Download File Size: ' + bytes + ' bytes';
    };
    xhr.onerror = () => report('Download failed. Check the connection.');
    xhr.ontimeout = () => report('Download timed out.');
    xhr.send();
  }
 </script>
 <!-- ******************************************************************** -->
 <!-- <p style="font-family: 'Arial', monospace; font-size: 20px; font-weight: bold; color: royalblue">Measuring Upload Speed</p> -->
 <p></p>
 <label class="custom-file-upload">
  Measuring Upload Speed
  <input type="file" id="fileInput" onchange="measureUploadSpeed()" style="background-color: royalblue; border: none; color: white; padding: 16px 32px; text-decoration: none; margin: 4px 2px; cursor: pointer; border-radius: 10px;">
 </label>
 <div style="height:20px;" id="uploadResult"></div>
 <script>
  function measureUploadSpeed() {
    const file = document.getElementById('fileInput').files[0];
    const report = message => {
      document.getElementById('uploadResult').textContent = message;
    };
    if (!file) return;
    if (file.size === 0) {
      report('Choose a nonempty file.');
      return;
    }
    const formData = new FormData();
    formData.append('file', file);
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/upload', true);
    xhr.responseType = 'json';
    xhr.timeout = 60000;
    const started = performance.now();
    xhr.onload = () => {
      if (xhr.status < 200 || xhr.status >= 300) {
        report('Upload failed (HTTP ' + xhr.status + ').');
        return;
      }
      if (!xhr.response || xhr.response.bytes_received !== file.size) {
        report('The server did not confirm the complete file.');
        return;
      }
      const seconds = (performance.now() - started) / 1000;
      if (seconds <= 0) {
        report('The upload duration could not be measured.');
        return;
      }
      report('Upload Speed: ' + (file.size * 8 / seconds / 1000000).toFixed(2) + ' Mbps');
      const sizeOutput = document.getElementById('uploadFileSize');
      if (sizeOutput) sizeOutput.textContent = 'Upload File Size: ' + file.size + ' bytes';
    };
    xhr.onerror = () => report('Upload failed. Check the connection.');
    xhr.ontimeout = () => report('Upload timed out.');
    xhr.send(formData);
  }
 </script>
 <!-- ******************************************************************** -->
 <!-- <p style="font-family: 'Arial', monospace; font-size: 20px; font-weight: bold; color: royalblue">Ping Speed</p> -->
 <p></p>
  <button onclick="pingServer();" style="background-color: royalblue; border: none; color: white; padding: 16px 32px; text-decoration: none; margin: 4px 2px; cursor: pointer; border-radius: 10px; width: 240px;">Ping to the Server</button>
  <div style="height:20px;" id="pingResult"></div>
  <script>
  function pingServer() {
    const xhr = new XMLHttpRequest();
    const report = message => {
      document.getElementById('pingResult').textContent = message;
    };
    xhr.open('GET', '/ping', true);
    xhr.timeout = 10000;
    const started = performance.now();
    xhr.onload = () => {
      if (xhr.status < 200 || xhr.status >= 300 || xhr.responseText !== 'Pong') {
        report('HTTP timing request failed.');
        return;
      }
      report('HTTP round trip: ' + (performance.now() - started).toFixed(1) + ' ms');
    };
    xhr.onerror = () => report('HTTP timing request failed.');
    xhr.ontimeout = () => report('HTTP timing request timed out.');
    xhr.send();
  }
 </script>
  <!-- ******************************************************************** -->
  <hr>
  <button onclick="location.reload();" style="background-color: royalblue; border: none; color: white; padding: 16px 32px; text-decoration: none; margin: 4px 2px; cursor: pointer; border-radius: 10px; width: 240px;">Page refresh</button>
  <hr>
  <!-- ******************************************************************** -->
</body>
</html>
